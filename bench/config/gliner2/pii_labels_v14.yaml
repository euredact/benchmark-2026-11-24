# The model card's label list (revision 1cb41660) plus job_title and money_amount, the two types guideline v1.4 adds
# (IT-300, HR-300, MED-300). GLiNER2 takes free-text labels, so a user would add them the same way.
# These are the native types; their coarse buckets are in config/labels/<set>.json (tool "gliner2").
labels: [person, full_name, first_name, middle_name, last_name, date_of_birth, email, phone_number, address,
  street_address, city, state_or_region, postal_code, country, government_id, national_id_number, passport_number,
  drivers_license_number, license_number, tax_id, tax_number, bank_account, account_number, routing_number, iban,
  payment_card, card_number, card_expiry, card_cvv, username, ip_address, account_id, sensitive_account_id, password,
  secret, api_key, access_token, recovery_code, sensitive_date, document_date, expiration_date, transaction_date, job_title, money_amount]

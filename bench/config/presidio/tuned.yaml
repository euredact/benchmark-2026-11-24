# Presidio tuned: about one week of configuration work by a team, using only Presidio's own mechanisms (pattern and
# deny-list recognizers, context words, checksums, the predefined country recognizers, the spaCy NER label mapping, the
# phone regions, an allow list and the score threshold). Tuned on the 10% dev slices only
# (bench/subsets/dev10_*.txt); see results/2026-10-30-presidio-tuning-log.md for the iterations.
models:
  en: en_core_web_lg
  fr: fr_core_news_lg
  de: de_core_news_lg
  nl: nl_core_news_lg
  pl: pl_core_news_lg
  da: da_core_news_lg  # added 2026-11-21 for the Danish parts of IT-360 / HR-360 / MED-360: a mechanical extension
                       # (model, credit cards); no Danish-specific tuning, so Danish scores are a floor

# Pattern recognizers without a label score 0.2-0.35 and need a context word to pass (Presidio adds 0.35 on context).
score_threshold: 0.4

# Dates are not personal data in themselves: drop spaCy's DATE/TIME (a date of birth recognizer below replaces them).
# Polish spaCy uses persName/placeName/geogName/orgName, which Presidio's default mapping lacks.
ner:
  model_to_presidio_entity_mapping:
    PER: PERSON
    PERSON: PERSON
    persName: PERSON
    LOC: LOCATION
    GPE: LOCATION
    placeName: LOCATION
    geogName: LOCATION
    ORG: ORGANIZATION
    orgName: ORGANIZATION
    NORP: NRP
  labels_to_ignore: [DATE, TIME, date, time, CARDINAL, ORDINAL, QUANTITY, MONEY, PERCENT, PRODUCT, EVENT, WORK_OF_ART,
                     LAW, LANGUAGE, FAC, MISC]

# US-only identifiers and the generic date and URL recognizers over-redact in European documents.
remove_recognizers: [DateRecognizer, UrlRecognizer, UsLicenseRecognizer, UsBankRecognizer, UsPassportRecognizer,
                     UsSsnRecognizer, UsItinRecognizer, MedicalLicenseRecognizer, CryptoRecognizer, EmailRecognizer]

phone_regions: [GB, IE, FR, BE, LU, DE, AT, CH, NL, PL, MT, IT, ES]  # not DK: a region applies to every language,
# and adding DK changed 8 held-out (non-Danish) documents (2026-11-21), so the tuned config stays as it was

builtin:
  - {name: PlPeselRecognizer, languages: [en, fr, de, nl]}
  - {name: CreditCardRecognizer, languages: [fr, de, nl, da]}  # da: added 2026-11-21, as for fr/de/nl
  - {name: UkNinoRecognizer, languages: [en]}
  - {name: UkPostcodeRecognizer, languages: [en]}
  - {name: UkVehicleRegistrationRecognizer, languages: [en]}
  - {name: UkDrivingLicenceRecognizer, languages: [en]}
  - {name: DeTaxIdRecognizer, languages: [de]}
  - {name: DeIdCardRecognizer, languages: [de]}
  - {name: DePassportRecognizer, languages: [de]}
  - {name: DeKfzRecognizer, languages: [de]}
  - {name: DeSocialSecurityRecognizer, languages: [de]}
  - {name: DeHealthInsuranceRecognizer, languages: [de]}

# Never personal data on their own: tool names, countries, salutations, document labels, plain dates (anchored regexes).
allow_list_match: regex
allow_list:
  - '^(?:Slack|Teams|Microsoft Teams|Jira(?: Service Mgmt)?|Confluence|Bitwarden|SharePoint|OneDrive|Outlook|Excel|Word|Azure(?: .*)?|Intune|Jamf|Okta|Zoom|GitHub|GitLab|Dropbox|Defender|FortiGate|PaperCut|Magento|Exact Online|Snipe-IT|ServiceNow|Workday|SAP|Windows(?: Hello)?|Linux|macOS|iOS|Android|YubiKey|Visa|Mastercard|e-card|Carte Vitale)$'
  - '^(?:EU|UK|USA?|Europe|Europa|Malta|Ireland|Irland|Irlande|Ierland|France|Frankreich|Frankrijk|Francja|Belgium|Belgique|België|Belgien|Belgia|Germany|Allemagne|Deutschland|Duitsland|Niemcy|Netherlands|Nederland|Niederlande|Pays-Bas|Holandia|Poland|Pologne|Polen|Polska|Austria|Autriche|Österreich|Oostenrijk|Switzerland|Suisse|Schweiz|Zwitserland|Szwajcaria|Luxembourg|Luxemburg|Luksemburg|Turkije|Türkei|Turquie|Turkey|Turcja|Spain|Espagne|Spanje|Hiszpania|Italy|Italie|Italië|Włochy)$'
  - '^(?:Madame|Monsieur|Mme|Herr|Frau|Mevrouw|Meneer|Pan|Pani|Dear|Hi|Hello|Bonjour|Hallo|Beste|Dag|Cc|OK|Adresse|Address|Adres|Location|Standort|Lieu)$'
  # role and team mailboxes and placeholder domains: not a person
  - '^(?:privacy|security|support|servicedesk|service|helpdesk|info|contact|kontakt|dpo|iod|rodo|datenschutz|legal|hr|rh|personeel|noreply|no-reply|awareness|soc|contracts?|contracten|basis|workplace-support|audit[\w-]*|admin|office|dg-office|relations[.\w]*|it|sales|billing|facturen|faktury|compliance|abuse|team|jobs|careers|recrutement|recruitment|secretariaat|secretariat|sekretariat|accueil|empfang|receptie|recepcja|payroll|paie|salaris|lohn|kadry|compta|finance|ops|devops|cert|csirt|alle|all|everyone)@'
  - '@example\.(?:com|org|net)$'
  # event dates (2009 on; a date of birth is older), years, times and short number fragments the phone matcher picks up
  - '^[\[(]?\d{1,2}[./–-]\d{1,2}[./–-]?(?:20(?:09|[1-3]\d)|\d{2})?(?: \d{1,2})?$'
  - '^[\[(]?\d{1,2}[.–-]+\d{1,2}[./]\d{1,2}[./]20(?:09|[1-3]\d)$'
  - '^(?=[\d\s./:()\[\]–-]+$)(?:\D*\d){1,6}\D*$'
  - '^20[0-3]\d(?:[- ]\d{2,4})?$'

recognizers:
  # --- contact ---
  - name: email_any_tld
    entity: EMAIL_ADDRESS
    patterns: [{name: email, regex: '\b[\w.+%-]+@[\w-]+(?:\.[\w-]+)+\b', score: 0.9}]

  - name: personal_url
    entity: PERSONAL_URL
    patterns:
      - {name: social, regex: '(?:https?://)?(?:www\.)?(?:linkedin\.com/in|github\.com|gitlab\.com|twitter\.com|x\.com|facebook\.com|instagram\.com|xing\.com/profile)/[\w./%-]+', score: 0.8}
      - {name: profile_path, regex: 'https?://[\w.-]+/(?:[\w-]+/)*(?:personal|people|profile|profiles|u|user|users|patient|patients|staff|team|member|members|employee|medewerkers|mitarbeiter)/[\w.~-]+', score: 0.7}
      - {name: tilde, regex: 'https?://[\w.-]+/~[\w.-]+', score: 0.7}
      - {name: git_user, regex: 'https?://git(?:lab|hub)?\.[\w.-]+/[\w.-]+/?(?=[\s)"'']|$)', score: 0.5}

  # --- names ---
  - name: person_after_title
    entity: PERSON
    patterns:
      - {name: title, regex: '(?<=\b(?:Mr|Mrs|Ms|Miss|Dr|Prof|Mme|Mlle|M|Me|Herr|Frau|Dhr|Mevr|Mw|Pan|Pani|lek|dr|mgr)\.?\s)(?-i:\p{Lu}[\p{L}''’-]+(?:\s\p{Lu}[\p{L}''’-]+){0,2})', score: 0.6}
  - name: person_greeting
    entity: PERSON
    patterns:
      - {name: greeting, regex: '(?<=^\s*(?:Dear|Hi|Hello|Bonjour|Chère|Cher|Liebe|Lieber|Hallo|Guten Tag|Beste|Dag|Hoi|Szanowna Pani|Szanowny Panie|Droga|Drogi|Cześć|Dzień dobry)\s)(?-i:\p{Lu}[\p{Ll}''’-]+(?:\s\p{Lu}[\p{Ll}''’-]+)?)(?=\s*[,!\n])', score: 0.6}
  - name: person_label
    entity: PERSON
    patterns:
      - {name: label, regex: '(?<=\b(?:Patient|Patientin|Patiënt|Patiente?|Pacjent|Pacjentka|Name|Nom|Naam|Full name|Nom complet|Imię i nazwisko|Caller|Employee|Mitarbeiter(?:in)?|Werknemer|Salarié(?:e)?|Pracownik|Antragsteller(?:in)?|Kandidat(?:in)?|Candidat(?:e)?|Kandidaat|Contact|Kontakt|Ansprechpartner(?:in)?|Approver|Owner|Requester|Demandeur|Aanvrager|Wnioskodawca)\s*:\s*)(?-i:\p{Lu}[\p{L}''’-]+(?:\s\p{Lu}[\p{L}''’-]+){0,2})', score: 0.55}
  - name: person_chat_speaker
    entity: PERSON
    patterns:
      - {name: chat, regex: '(?<=^\s*\[?\d{1,2}[:.]\d{2}(?::\d{2})?\]?\s+)(?-i:\p{Lu}[\p{Ll}''’-]+(?:\s\p{Lu}[\p{L}''’-]+)+)(?=\s*:)', score: 0.6}
      - {name: signoff, regex: '(?<=^(?:Kind regards|Best regards|Regards|Cordialement|Bien à vous|Mit freundlichen Grüßen|Viele Grüße|Met vriendelijke groet|Groeten|Z poważaniem|Pozdrawiam)\s*,?\s*\n+)(?-i:\p{Lu}[\p{Ll}''’-]+(?:\s\p{Lu}[\p{L}''’-]+)?)$', score: 0.6}

  - name: username
    entity: USERNAME
    patterns:
      # after a label and ':', '=' or a quote: any login-shaped token; after a label and a space: only when it has a digit, '.' or '_'
      - {name: label_sep, regex: '(?<=\b(?:user(?:name)?|user id|login|account|compte|konto|gebruiker(?:snaam)?|accountnaam|Benutzer(?:name|kennung)?|Anmeldename|Kennung|identifiant|nazwa użytkownika|login_name|github_login|sAMAccountName|UPN)\s*[:=«"“'']\s*)(?-i:[a-z][a-z0-9._-]{2,30}[a-z0-9])\b(?!@)', score: 0.6}
      - {name: label_shape, regex: '(?<=\b(?:user(?:name)?|login|account|compte|konto|gebruiker|Benutzer|identifiant)\s+)(?-i:[a-z]+(?:[._][a-z]+\d*|\d{1,3}))\b(?!@)', score: 0.6}
      - {name: first_dot_last, regex: '(?<![@\w.-])(?-i:[a-z]{2,}\.[a-z]{2,}(?:-[a-z]+)?\d{0,3})\b(?<!\.(?:py|js|ts|json|ya?ml|xml|csv|txt|log|pdf|docx?|xlsx?|html?|md|sh|ps1|exe|dll|cfg|conf|ini|env|internal|local|lan|corp|com|org|net|io|de|fr|nl|pl|be|eu|uk|at|ch|lu|ie|mt|it|es|example|test|invalid|svc|cluster|prod|dev|staging))(?![@\w]|\.\w)', score: 0.45}
      - {name: name_digits, regex: '\b(?-i:[a-z]{5,}\d{2})\b(?![@\w.])', score: 0.45}
      - {name: chat_handle, regex: '(?<=^\s*\[?\d{1,2}[:.]\d{2}\]?\s+)(?-i:[a-z][a-z0-9._-]{2,30})(?=:)', score: 0.6}
      - {name: in_parens, regex: '(?<=(?-i:\p{Lu}\p{Ll}+\s\p{Lu}[\p{Ll}''’-]+)\s\()(?-i:[a-z]+[._]?[a-z]+\d{0,3})(?=\))', score: 0.5}
      - {name: after_name, regex: '(?<=(?-i:\p{Lu}\p{Ll}+\s\p{Lu}[\p{Ll}''’-]+)\s?[,–-]\s?(?:compte\s|konto\s|account\s)?)(?-i:[a-z]+(?:[._][a-z]+\d*|\d{1,3}))(?=[),;\s])', score: 0.5}

  # --- dates of birth: a date near a birth word, or a date in a plausible birth year ---
  - name: date_of_birth
    entity: DATE_OF_BIRTH
    patterns:
      - {name: labelled, regex: '(?<=\b(?:born|birth|DOB|d\.o\.b\.?|geboren|geb\.|Geburtsdatum|Geburtstag|geboortedatum|né|née|naissance|urodzon\w*|urodzenia|ur\.)[^\n\d]{0,25})(?:\d{1,2}[./-]\d{1,2}[./-]\d{2,4}|\d{4}-\d{2}-\d{2}|\d{1,2}\.?\s+\p{L}+\.?\s+\d{4}|\p{L}+\s+\d{1,2},?\s+\d{4})', score: 0.85}
      - {name: birth_year, regex: '\b(?:\d{1,2}[./-]\d{1,2}[./-](?:19[2-9]\d|200[0-8])|(?:19[2-9]\d|200[0-8])-\d{2}-\d{2})\b', score: 0.5}

  # --- government identifiers ---
  - name: nl_bsn
    entity: NATIONAL_ID
    validator: bsn
    patterns: [{name: bsn, regex: '(?<=\b(?:BSN|burgerservicenummer|sofinummer)\W{0,12})\d{4}\.?\d{2}\.?\d{3}\b', score: 0.6}]
  - name: be_rrn
    entity: NATIONAL_ID
    validator: be_rrn
    patterns: [{name: rrn, regex: '\b\d{2}\.?\d{2}\.?\d{2}[-. ]?\d{3}[. ]?\d{2}\b', score: 0.3}]
    context: [rijksregister, rijksregisternummer, registre national, numéro national, INSZ, NISS, Nationalregister]
  - name: fr_nir
    entity: NATIONAL_ID
    validator: fr_nir
    patterns: [{name: nir, regex: '\b[12]\s?\d{2}\s?\d{2}\s?(?:\d{2}|2A|2B)\s?\d{3}\s?\d{3}\s?\d{2}\b', score: 0.6}]
  - name: id_card_labelled
    entity: NATIONAL_ID
    patterns: [{name: label, regex: '(?<=\b(?:ID card|identity card|national ID|Personalausweis|Ausweis(?:nummer)?|carte d''identité|CNI|identiteitskaart|eID|dowód osobisty|dowodu osobistego|National Insurance number|NINO|PPS(?:N| number)?)\W{0,8}(?:n[or°º.]+\s*|Nr\.?\s*|number\s*)?)(?-i:[A-Z0-9][A-Z0-9 ]{5,14}[A-Z0-9])\b', score: 0.6}]
  - name: passport
    entity: PASSPORT
    patterns: [{name: label, regex: '(?<=\b(?:passport|Reisepass|Pass|paspoort|passeport|paszport\w*)\W{0,10}(?:n[or°º.]+\s*|Nr\.?\s*|number\s*|nummer\s*|numer\s*)?)(?-i:[A-Z0-9]{7,10})\b', score: 0.6}]
  - name: drivers_license
    entity: DRIVERS_LICENSE
    patterns: [{name: label, regex: '(?<=\b(?:driving licen[cs]e|driver''s licen[cs]e|Führerschein|Führerausweis|rijbewijs|permis(?: de conduire)?|prawo jazdy|prawa jazdy)\W{0,10}(?:n[or°º.]+\s*|Nr\.?\s*|number\s*|nummer\s*|numer\s*)?)(?-i:[A-Z0-9][A-Z0-9/]{5,17})\b', score: 0.6}]
  - name: vehicle_plate
    entity: VEHICLE_PLATE
    patterns:
      - {name: label, regex: '(?<=\b(?:registration|reg\.? no|number plate|Kennzeichen|Kfz-Kennzeichen|kenteken|nummerplaat|immatriculation|plaque|numer rejestracyjny|nr rej\.?|tablica)\W{0,6})(?-i:[A-Z]{1,3}[- ]?[A-Z0-9]{1,4}[- ]?[A-Z0-9]{1,4})\b', score: 0.6}
      - {name: nl_plate, regex: '\b(?-i:\d{1,2}-[A-Z]{2,3}-\d{1,2}|[A-Z]{2}-\d{2,3}-[A-Z]{1,2}|\d{2}-[A-Z]{2}-\d{2}|[A-Z]{2}-[A-Z]{2}-\d{2}|\d{2}-\d{2}-[A-Z]{2}|[A-Z]{1,3}-\d{2,3}-[A-Z]{1,3})\b', score: 0.45}
      - {name: pl_plate, regex: '\b(?-i:[A-Z]{2,3}\s?\d{4,5}[A-Z]?|[A-Z]{2,3}\s?\d{3}[A-Z]{2}|[A-Z]{2}\d{2}\s?[A-Z]{3})\b', score: 0.2}
    context: [pojazd, auto, samochód, parking, ANPR, car, vehicle, Fahrzeug, voertuig, véhicule, parkeer, Stellplatz, rejestracja]
  - name: tax_id
    entity: TAX_ID
    patterns: [{name: label, regex: '(?<=\b(?:btw(?:-nummer|-nr)?|BTW|VAT(?: no| number)?|TVA|USt-IdNr\.?|Umsatzsteuer-ID|Steuernummer|Steuer-ID|Steuer-IdNr\.?|numéro fiscal|NIF|TIN|UTR|NIP|REGON|KvK(?:-nummer)?|Handelsregister(?: onder nummer)?|KBO|ondernemingsnummer|SIREN|SIRET|HRB)\W{0,10})(?-i:[A-Z]{0,2}[0-9][0-9A-Z. -]{6,16}[0-9A-Z])\b', score: 0.6}]

  # --- financial ---
  - name: masked_card
    entity: PAYMENT_CARD
    patterns: [{name: masked, regex: '(?:\*{4}[ -]?){1,3}\d{4}\b', score: 0.6}]

  # --- addresses ---
  - name: street_address
    entity: STREET_ADDRESS
    patterns:
      - {name: nl_de, regex: '\b(?-i:\p{Lu}[\p{L}''’-]*(?:straat|laan|weg|plein|dreef|kade|gracht|singel|steenweg|lei|hof|markt|pad|Straße|straße|strasse|Strasse|str\.|gasse|Gasse|allee|Allee|ring|platz|Platz|damm|ufer|weg))\s+\d{1,4}\s?[a-zA-Z]?(?:[-/]\d{1,4}[a-zA-Z]?)?\b', score: 0.6}
      - {name: fr, regex: '\b\d{1,4}(?:\s?(?:bis|ter))?,?\s+(?:rue|avenue|av\.|boulevard|bd|place|chemin|allée|impasse|quai|route|chaussée|square)\s+(?:de la |du |des |de l''|d''|de )?(?-i:\p{Lu}[\p{L}''’-]+(?:\s\p{Lu}[\p{L}''’-]+){0,3})', score: 0.6}
      - {name: en, regex: '\b\d{1,4}[a-zA-Z]?\s+(?-i:(?:\p{Lu}[\p{L}''’]+\s){1,3}(?:Street|St|Road|Rd|Avenue|Ave|Lane|Close|Drive|Way|Court|Place|Crescent|Terrace|Gardens|Square|Row|Hill|Park|Grove|Walk|Mews))\b', score: 0.6}
      - {name: pl, regex: '\b(?:ul\.|al\.|pl\.|os\.)\s+(?-i:\p{Lu}[\p{L}.''’-]+(?:\s\p{Lu}[\p{L}.''’-]+)?)\s+\d{1,4}[a-zA-Z]?(?:/\d{1,4})?', score: 0.6}
  - name: postcode_city
    entity: POSTCODE_CITY
    patterns:
      - {name: nl, regex: '\b(?-i:\d{4}\s?[A-Z]{2}\s+\p{Lu}[\p{L}-]+)', score: 0.6}
      - {name: pl, regex: '\b(?-i:\d{2}-\d{3}\s+\p{Lu}[\p{L}-]+)', score: 0.6}
      - {name: d5, regex: '(?<=(?:,|·|–|—|\n|^)\s*)(?:[A-Z]-|F-|D-|L-)?(?-i:\d{5}\s+\p{Lu}[\p{L}-]+(?:[ -](?:am|an|sur|en|im|bei|in|le|la)?\s?\p{Lu}[\p{L}-]+)?)', score: 0.6}
      - {name: d4, regex: '(?<=(?:,|·|–|—|\n|^)\s*)(?:[A-Z]-|B-|L-|CH-|A-)?(?-i:\d{4}\s+\p{Lu}[\p{L}-]+(?:[ -](?:sur|en|am|an|le)?\s?\p{Lu}[\p{L}-]+)?)', score: 0.6}
      - {name: uk_city_postcode, regex: '\b(?-i:\p{Lu}\p{Ll}+\s[A-Z]{1,2}\d[A-Z\d]?\s\d[A-Z]{2})\b', score: 0.6}
      - {name: uk_postcode, regex: '\b(?-i:[A-Z]{1,2}\d[A-Z\d]?\s\d[A-Z]{2})\b', score: 0.5}
      - {name: eircode, regex: '\b(?-i:[AC-FHKNPRTV-Y]\d[\dW]\s?[0-9AC-FHKNPRTV-Y]{4})\b', score: 0.5}

  - name: city_gazetteer
    entity: LOCATION
    patterns:
      - {name: cities, regex: '\b(?-i:Esch\-sur\-Alzette|Clermont\-Ferrand|Aix\-en\-Provence|Saint\-Étienne|''s\-Gravenhage|Sint\-Niklaas|Villeurbanne|Montpellier|Southampton|Differdange|Częstochowa|Saarbrücken|Nottingham|Düsseldorf|Schaerbeek|Luxembourg|Klagenfurt|Birkirkara|Amersfoort|Portsmouth|Manchester|Regensburg|Strasbourg|Ettelbruck|Maastricht|Winterthur|St\.\ Gallen|Heidelberg|Birmingham|Leeuwarden|Anderlecht|Hilversum|Innsbruck|Bielefeld|Eindhoven|Sheffield|Perpignan|Edinburgh|Leicester|Waterford|Bruxelles|Neuchâtel|Antwerpen|Charleroi|Karlsruhe|Amsterdam|Wuppertal|Stuttgart|Groningen|Vilvoorde|Dudelange|Dordrecht|Białystok|Frankfurt|Marseille|Bydgoszcz|Apeldoorn|Wiesbaden|Newcastle|Rotterdam|Roeselare|Luxemburg|Cambridge|Liverpool|Verviers|Zaanstad|Deventer|Mulhouse|Freiburg|Hannover|Mannheim|Den\ Haag|Fribourg|Coventry|Turnhout|Mechelen|Nürnberg|Limerick|Szczecin|Lausanne|Diekirch|Würzburg|Le\ Havre|Enschede|Salzburg|Grenoble|Bordeaux|Toulouse|Augsburg|Besançon|Katowice|Brighton|Drogheda|Valletta|Nijmegen|Aberdeen|Poitiers|Plymouth|Duisburg|Warszawa|Brussels|Kilkenny|Kortrijk|Oostende|Dortmund|Olsztyn|Orléans|Ostende|Alkmaar|Cologne|Münster|Reading|Bristol|Louvain|Hamburg|Hasselt|München|Rostock|Gliwice|Haarlem|Le\ Mans|Utrecht|Dresden|Lucerne|Glasgow|Belfast|Cardiff|Heerlen|Doornik|Seraing|Tilburg|Wroclaw|Angleur|Potsdam|Rzeszów|Villach|Brussel|Leipzig|Avignon|Limoges|Wrocław|Ixelles|Tournai|Gdansk|Leiden|Kraków|Munich|Sliema|London|Almere|Zürich|Elsene|Anvers|Zabrze|Leuven|Kempen|Bruges|Bergen|Bochum|Poznan|Kielce|Toulon|Berlin|Galway|Poznań|Erfurt|Amiens|Aachen|Warsaw|Gdynia|Bremen|Oxford|Geneva|Gdańsk|Zwolle|Lublin|Nantes|Zurich|Żabbar|Angers|Brugge|Dublin|Vienna|Luzern|Lübeck|Arnhem|Rennes|Kassel|Lugano|Genève|Krakow|Dundee|Uccle|Paris|Rouen|Namur|Radom|Qormi|Liège|Venlo|Mainz|Essen|Nancy|Gżira|Brest|Berne|Arlon|Toruń|Reims|Basel|Gouda|Msida|Opole|Dijon|Leeds|Tours|Lille|Aalst|Nîmes|Namen|Sopot|Waver|Wavre|Mosta|Delft|Breda|Luik|Geel|Nice|Bonn|Graz|Łódź|Gent|Köln|Lyon|York|Genk|Lodz|Metz|Sion|Gand|Kiel|Thun|Mons|Bâle|Genf|Caen|Wien|Cork|Linz|Bern|Biel|Lier|Wels|Zug|Ulm)\b', score: 0.5}
      - {name: pl_inflected, regex: '\b(?-i:(?:Warszaw|Krakow|Krakowi|Łodzi|Wrocław|Poznani|Poznań|Gdańsk|Gdańsku|Szczecin|Bydgoszcz|Lublin|Białymstoku|Białegostoku|Katowic|Gdyni|Olsztyn|Opol|Sopot|Toruni|Kielc|Rzeszow)\p{Ll}{0,3})\b', score: 0.5}

  # --- organisation-issued identifiers, only with a label ---
  - name: employee_id
    entity: EMPLOYEE_ID
    patterns:
      - {name: label, regex: '(?<=\b(?:Personalnummer|Personalnr\.?|Personal-Nr\.?|Pers\.-?Nr\.?|matricule|n° matricule|personeelsnummer|personeelsnr\.?|employee[ _]?(?:id|number|no\.?)|staff (?:id|number|no\.?)|emp(?:loyee)? id|numer (?:pracownika|ewidencyjny)|nr ewid\.?|ID pracownika)\W{0,8})(?-i:[A-Z]{0,4}-?\d{3,8})\b', score: 0.6}
      - {name: prefixed, regex: '\b(?-i:(?:EMP|PN|ZID|EE|MA|STAFF|PERS)-\d{4,6})\b', score: 0.45}
